<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Conveyor Belt Anomaly Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
 body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}
 header{background:#1f3b63;color:#fff;padding:14px 24px;font-size:18px}
 main{padding:18px 24px;max-width:1100px;margin:auto}
 .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:#fff;padding:12px;border-radius:8px;margin-bottom:14px}
 label{font-size:12px;display:block;color:#555} input,select{padding:6px;width:110px}
 button{background:#1f3b63;color:#fff;border:0;padding:9px 18px;border-radius:6px;cursor:pointer}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
 .card{background:#fff;border-radius:8px;padding:10px 14px}.card b{display:block;font-size:22px;color:#1f3b63}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;margin-bottom:14px;font-size:13px}
 th,td{padding:7px 10px;border-bottom:1px solid #e3e6ea;text-align:left} th{background:#e8edf4}
 .ok{color:#1a7f37;font-weight:bold}.bad{color:#c62828;font-weight:bold}
 .chart{background:#fff;border-radius:8px;padding:8px;margin-bottom:10px;height:190px}
</style></head><body>
<header>Conveyor Belt Joint Rupture – DBSCAN Anomaly Dashboard (SIH26008)</header>
<main>
 <div class="row">
  <div><label>eps (blank = auto)</label><input id="eps" type="number" step="0.05"></div>
  <div><label>min_samples</label><input id="ms" type="number" value="20"></div>
  <div><label>lookback (h)</label><input id="lb" type="number" value="48"></div>
  <button onclick="run()">Run analysis</button><span id="msg"></span>
 </div>
 <div class="cards" id="cards"></div>
 <table id="inc"></table>
 <div class="row"><div><label>Joint</label><select id="joint" onchange="loadJoint()"></select></div><span id="rup"></span></div>
 <div class="chart"><canvas id="c0"></canvas></div><div class="chart"><canvas id="c1"></canvas></div><div class="chart"><canvas id="c2"></canvas></div>
</main>
<script>
const API = "";   // same origin. If frontend runs elsewhere (React/Vite), use "http://127.0.0.1:8000"
const charts = [];
async function run(){
  msg.textContent = "Running..."; const e = document.getElementById("eps").value;
  const r = await fetch(API+"/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({eps:e===""?null:parseFloat(e),min_samples:+ms.value,lookback_hours:+lb.value})});
  if(!r.ok){msg.textContent="Error "+r.status;return;} const d = await r.json(); msg.textContent="";
  const s = d.summary, k = (a,b)=>`<div class="card">${a}<b>${b}</b></div>`;
  cards.innerHTML = k("Detected",`${s.incidents_detected}/${s.incidents}`)+k("Mean lead time",(s.mean_lead_time_h??"-")+" h")
    +k("False alarms",s.false_alarms)+k("eps used",s.eps)+k("Flagged readings",`${s.flagged_points}/${s.total_points}`);
  inc.innerHTML = "<tr><th>Incident</th><th>Joint</th><th>Rupture</th><th>Detected</th><th>First alert</th><th>Lead (h)</th></tr>"+
    d.incidents.map(i=>`<tr><td>${i.incident_id}</td><td>${i.joint_id}</td><td>${i.rupture_time.replace("T"," ").slice(0,16)}</td>
    <td class="${i.detected?"ok":"bad"}">${i.detected?"Yes":"No"}</td><td>${i.first_alert?i.first_alert.replace("T"," ").slice(0,16):"-"}</td><td>${i.lead_time_h??"-"}</td></tr>`).join("");
  joint.innerHTML = d.joints.map(j=>`<option>${j}</option>`).join(""); loadJoint();
}
async function loadJoint(){
  const d = await (await fetch(API+"/api/joint/"+joint.value)).json();
  rup.textContent = d.rupture ? "Rupture at "+d.rupture.replace("T"," ") : "No rupture logged for this joint";
  charts.forEach(c=>c.destroy()); charts.length = 0;
  [["vibration","Vibration RMS"],["tension","Tension (kN)"],["temperature","Temperature (°C)"]].forEach(([key,name],i)=>{
    charts.push(new Chart(document.getElementById("c"+i),{type:"line",
      data:{labels:d.t,datasets:[{label:name,data:d[key],borderWidth:1,borderColor:"#4a7ab8",
        pointRadius:d.flag.map(f=>f?3:0),pointBackgroundColor:d.flag.map(f=>f?"#d62728":"#4a7ab8")}]},
      options:{animation:false,maintainAspectRatio:false,plugins:{legend:{display:true}},scales:{x:{ticks:{maxTicksLimit:8}}}}}));
  });
}
run();
</script></body></html>
